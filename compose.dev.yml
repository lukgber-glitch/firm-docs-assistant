# Local development / test database only. Production uses deploy/compose.yml (no host port for Postgres).
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: docs-demo-dev-db
    environment:
      POSTGRES_USER: docs
      POSTGRES_PASSWORD: docs
      POSTGRES_DB: docs
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docs -d docs"]
      interval: 3s
      retries: 20
